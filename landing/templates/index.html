<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fantasy Shred</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: #081018;
      color: #f4f7fa;
    }
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
      background: linear-gradient(180deg, #0c1c2d 0%, #081018 100%);
    }
    h1 {
      font-size: 4rem;
      margin-bottom: 10px;
      letter-spacing: 0.04em;
    }
    p {
      max-width: 720px;
      line-height: 1.7;
      color: #d3dde7;
      font-size: 1.1rem;
    }
    .buttons {
      margin-top: 30px;
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    a.button {
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      background: #2d8cff;
      color: white;
      font-weight: 600;
    }
    a.secondary {
      background: transparent;
      border: 1px solid #3e5369;
    }
  </style>
</head>
<body>
  <section class="hero">
    <h1>Fantasy Shred</h1>
    <p>
      A developing platform dedicated to ski culture, historical mountain archives,
      trail-map evolution, lift history, lost ski areas, and the changing geography
      of alpine recreation over the past century.
    </p>

    <div class="buttons">
      <a class="button" href="/area-archives/">Explore Area Archives</a>
      <a class="button secondary" href="https://github.com/Matt-CloudEngineering/ski-area-hist-arch">Project Repository</a>
    </div>
  </section>
</body>
</html>
